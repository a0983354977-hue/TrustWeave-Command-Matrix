[package]
name = "trustweave-command-matrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Forwards the pure-Rust YARA-X scanner from the engine into the desktop shell,
# enabling Mode 2 (external threat hunting) without a C toolchain.
yara-scanner = ["tw-engine/yara-scanner"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tw-engine = { path = "../../crates/tw-engine" }
