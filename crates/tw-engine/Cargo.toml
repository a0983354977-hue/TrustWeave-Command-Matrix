[package]
name = "tw-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tw-engine"
path = "src/main.rs"

[dependencies]
# Cryptographic primitives
sha2 = { workspace = true }
blake3 = { workspace = true }
merkletree = { workspace = true }

# High-performance file traversal
walkdir = { workspace = true }
ignore = { workspace = true }

# Parallel computation
rayon = { workspace = true }
crossbeam-channel = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

# Malware scanning (optional). yara-x is a pure-Rust YARA reimplementation:
# no libyara, no bindgen, no libclang, so it builds on any Rust toolchain.
yara-x = { version = "1.21", optional = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ring = "0.17"

# Path normalization
path-absolutize = { workspace = true }
normalize-path = { workspace = true }

[features]
default = []
yara-scanner = ["yara-x"]

[dev-dependencies]
tempfile = { workspace = true }
